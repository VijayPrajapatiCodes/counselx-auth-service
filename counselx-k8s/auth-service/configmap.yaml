apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: counselx
data:
  SERVER_PORT: "8081"
  CORS_ALLOWED_ORIGINS: "https://counselx.nexorachat.online"
  AUTH_EMAIL_OTP_EXPIRATION_MINUTES: "10"
  AUTH_EMAIL_OTP_MAX_ATTEMPTS: "5"
  AUTH_EMAIL_OTP_COOLDOWN_SECONDS: "60"
  AUTH_EMAIL_OTP_MAX_PER_HOUR: "5"
  JWT_EXPIRATION: "900000"
  JWT_REFRESH_EXPIRATION_DAYS: "7"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
