apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: counselx
  labels:
    app: auth-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: counselx-auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: DB_HOST}}
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: DB_PORT}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: DB_NAME}}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: DB_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: JWT_SECRET}}
            - name: MAIL_USERNAME
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: MAIL_USERNAME}}
            - name: MAIL_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: MAIL_PASSWORD}}
            - name: REDIS_HOST
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: REDIS_HOST}}
            - name: REDIS_PORT
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: REDIS_PORT}}
            - name: REDIS_USERNAME
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: REDIS_USERNAME}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: REDIS_PASSWORD}}
            - name: REDIS_TLS_HOST
              valueFrom: {secretKeyRef: {name: auth-service-secrets, key: REDIS_TLS_HOST}}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
