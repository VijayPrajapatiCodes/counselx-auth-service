spring.application.name=auth-service

server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration-days=7

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Gmail SMTP - testing configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email OTP
auth.email-otp.expiration-minutes=10
auth.email-otp.max-attempts=5

# AWS ElastiCache Serverless Valkey
# Local Windows development connects through an SSH tunnel.
spring.data.redis.host=${REDIS_HOST:counselx-redis-1bfkdu.serverless.aps1.cache.amazonaws.com}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true
spring.data.redis.connect-timeout=10s
spring.data.redis.timeout=10s
spring.data.redis.client-name=counselx-auth-service

# AWS endpoint used as TLS hostname when configuring the tunnel.
redis.tls.hostname=${REDIS_TLS_HOST:counselx-redis-1bfkdu.serverless.aps1.cache.amazonaws.com}

# Redis-backed OTP rate limiting
auth.email-otp.cooldown-seconds=60
auth.email-otp.max-per-hour=5
